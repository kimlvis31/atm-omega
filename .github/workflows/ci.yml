name: Omega isolated checks

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Free-budget-approved platform for this commit
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
          - both

permissions:
  contents: read

concurrency:
  group: omega-ci-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    # Evaluated before runner allocation. Never enable without account $0 hard stop.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          vars.OMEGA_FREE_CI_READY == 'true' &&
          vars.OMEGA_FREE_CI_APPROVED_SHA == github.sha &&
          vars.OMEGA_FREE_CI_PROFILE == inputs.platform }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: >-
          ${{ fromJSON(inputs.platform == 'both' &&
          '[{"os":"ubuntu-24.04","lock":"requirements/dev-linux-cp313.lock","python":".venv/bin/python"},{"os":"windows-2025","lock":"requirements/dev-win-cp313.lock","python":".venv/Scripts/python.exe"}]' ||
          inputs.platform == 'windows' &&
          '[{"os":"windows-2025","lock":"requirements/dev-win-cp313.lock","python":".venv/Scripts/python.exe"}]' ||
          '[{"os":"ubuntu-24.04","lock":"requirements/dev-linux-cp313.lock","python":".venv/bin/python"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      VENV_PYTHON: ${{ matrix.python }}
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-10-24
        with:
          python-version-file: .python-version
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Prepare test and build directories
        run: python -I -c "from pathlib import Path; Path('.tools').mkdir(exist_ok=True)"
      - name: Install hashed development dependencies
        run: '"$VENV_PYTHON" -I -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r "${{ matrix.lock }}"'
      - name: Dependency consistency
        run: '"$VENV_PYTHON" -I -m pip --isolated check'
      - name: Style and dependency boundaries
        run: |
          "$VENV_PYTHON" -I -m ruff check src tests
          "$VENV_PYTHON" -I -m ruff format --check src tests
      - name: Network-free tests including spawned control owner
        run: '"$VENV_PYTHON" -I -m pytest --basetemp=.tools/pytest-ci -q'
      - name: Build package without fetching build dependencies
        run: '"$VENV_PYTHON" -I -m build --no-isolation --outdir .tools/dist'
