name: atm-omega

services:
  postgres:
    image: timescale/timescaledb:2.31.0-pg18@sha256:0fcff5761363809d1242f2261a3482197b5a5337407f8b97a976fb174206d579
    restart: "no"
    ports:
      - "127.0.0.1:${OMEGA_DB_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${OMEGA_DB_NAME:-omega}
      POSTGRES_USER: omega_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      OMEGA_DB_PASSWORD_FILE: /run/secrets/db_app_password
      PGDATA: /pgdata
    secrets:
      - db_admin_password
      - db_app_password
    volumes:
      - postgres_data:/pgdata
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=20
      - -c
      - timescaledb.telemetry_level=off
    shm_size: 256mb
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U omega_admin -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

secrets:
  db_admin_password:
    file: ./secrets/db_admin_password
  db_app_password:
    file: ./secrets/db_app_password
