name: atm-omega-collector-live

services:
  postgres:
    image: timescale/timescaledb:2.31.0-pg18@sha256:0fcff5761363809d1242f2261a3482197b5a5337407f8b97a976fb174206d579
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMEGA_LIVE_DB_PORT:-55441}:5432"
    environment:
      POSTGRES_DB: omega_collector_live
      POSTGRES_USER: omega_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      OMEGA_DB_PASSWORD_FILE: /run/secrets/db_app_password
      PGDATA: /pgdata
    secrets: [db_admin_password, db_app_password]
    tmpfs: [/var/lib/postgresql]
    volumes:
      - postgres_data:/pgdata
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=20, -c, timescaledb.telemetry_level=off]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, omega_admin, -d, omega_collector_live]
      interval: 3s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  collector:
    image: atm-omega-collector-live-collector
    build:
      context: ../..
      dockerfile: deploy/collector/Dockerfile
    network_mode: host
    restart: "on-failure:5"
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [db_app_password, api_token]
    volumes:
      - ../../state/kbeeshome-collector:/run/omega
    command:
      - --collect-auxiliary
      - --db-config
      - /run/omega/database.config.toml
      - --request-budget-file
      - /run/omega/binance-public-budget.json
      - --series-effective-from-ms
      - "${OMEGA_EFFECTIVE_FROM_MS:?Set the original series effective time}"
      - --api-port
      - "${OMEGA_LIVE_API_PORT:-18766}"
      - --api-token-file
      - /run/secrets/api_token
      - --subscription
      - spot:BTCUSDT
      - --subscription
      - spot:ETHUSDT
      - --subscription
      - spot:BNBUSDT
      - --subscription
      - spot:SOLUSDT
      - --subscription
      - spot:XRPUSDT
      - --subscription
      - usdm:BTCUSDT
      - --subscription
      - usdm:ETHUSDT
      - --subscription
      - usdm:BNBUSDT
      - --subscription
      - usdm:SOLUSDT
      - --subscription
      - usdm:XRPUSDT
      - --subscription
      - spot:AAPLBUSDT
      - --subscription
      - spot:TSLABUSDT
      - --subscription
      - spot:NVDABUSDT
      - --subscription
      - spot:AMZNBUSDT
      - --subscription
      - spot:MSFTBUSDT
      - --subscription
      - usdm:AAPLUSDT
      - --subscription
      - usdm:TSLAUSDT
      - --subscription
      - usdm:NVDAUSDT
      - --subscription
      - usdm:AMZNUSDT
      - --subscription
      - usdm:MSFTUSDT
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  history:
    image: atm-omega-collector-live-collector
    network_mode: host
    restart: "on-failure:5"
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [db_app_password]
    volumes:
      - ../../state/kbeeshome-collector:/run/omega
    entrypoint: [python, -I, -B, -m, omega.runtime.collector_history]
    command: [--root, /run/omega]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  postgres_data:

secrets:
  db_admin_password:
    file: ../../secrets/kbeeshome-collector/db_admin_password
  db_app_password:
    file: ../../secrets/kbeeshome-collector/db_app_password
  api_token:
    file: ../../secrets/kbeeshome-collector/api_token
