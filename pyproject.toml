[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atm-omega"
version = "0.1.0.dev0"
description = "Modular ATM trading core and Binance adapters"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
streaming = ["websockets==17.2"]

[project.scripts]
omega-collect = "omega.runtime.collect_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omega*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
